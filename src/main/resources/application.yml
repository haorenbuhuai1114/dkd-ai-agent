server:
  port: 8081

spring:
  application:
    name: dkd-ai-agent

  data:
    redis:
      host: 192.168.100.128
      port: 6379
      password: 123321
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  ai:
    zhipuai:
      api-key: ${ZHIPU_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas
      chat:
        options:
          model: glm-4-flash
          temperature: 0.3
          max-tokens: 2000

dkd:
  base-url: http://127.0.0.1:8080
  token: ${DKD_TOKEN:}

logging:
  level:
    com.dkd.ai: debug
